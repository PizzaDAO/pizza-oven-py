[tool.poetry]
name = "pizza-oven-py"
version = "0.0.1"
description = "Rare Pizzas Kitchen"
license = "GPL"
authors = ["The Pizza Mafia <hello@rarepizzas.com>"]
readme = "README.md"
homepage = "https://rarepizzas.com"
repository = "https://github.com/PizzaDAO/pizza-oven-py"
documentation = "https://github.com/PizzaDAO/pizza-oven-py"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.9"
ipfshttpclient = "^0.7.0"
pillow = "^10.2.0"
dropbox = "^11.36.2"
base58 = "^2.1.1"
google-api-python-client = "^2.118.0"
google-auth-httplib2 = "^0.2.0"
google-auth-oauthlib = "^1.2.0"
web3 = "^6.15.1"
fastapi = "^0.109.2"
firebase-admin = "^6.4.0"
pydantic-settings = "^2.2.0"

[tool.poetry.group.dev.dependencies]
black = { version = "24.1.1", allow-prereleases = false }
mypy = "^1.8.0"
pydeps = "*"
pylint = "*"
pytest = "*"
requests = "^2.24.0"

[tool.black]
target-version = ['py39']
include = '\.pyi?$'

[tool.pylint.'FORMAT']
max-line-length = 120

[tool.pylint.'MESSAGES CONTROL']
disable = '''
  duplicate-code,
  fixme,
  invalid-name,
  missing-module-docstring,
  missing-function-docstring,
  no-value-for-parameter,
  redefined-builtin,
  too-few-public-methods,
  too-many-arguments,
  too-many-branches,
  too-many-function-args,
  too-many-lines,
  too-many-locals,
  too-many-nested-blocks,
  unnecessary-lambda,
  '''

[build-system]
requires = ["poetry>=1.7.1"]
build-backend = "poetry.masonry.api"

[mypy]
python_version = 3.9
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
show_column_numbers = true
